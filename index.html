<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klaviatura sarguzashti – 6 bosqichli o’yin</title>
  <style>
    :root {
      --bg: #e9eef5;
      --card: #fff;
      --ink: #1b2540;
      --mute: #5b6784;
      --line: #c4cde0;
      --acc: #2f5bea;
      --accink: #fff;
      --ok: #1f9d6b;
      --bad: #d64550;
      --warn: #f2b134;
      --f0: #4cae2f;
      --f1: #e8242c;
      --f2: #f8a51b;
      --f3: #1aa7ec;
      --f4: #4cae2f;
      --f5: #ee1f80;
      --f6: #9b4fc6;
      --f7: #1f5fd0;
      --f8: #9b4fc6;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #10162a;
        --card: #1a2340;
        --ink: #eef1fb;
        --mute: #9aa6c6;
        --line: #34416b;
        --acc: #7b9bff;
        --accink: #10162a;
        --ok: #4fd1a1;
        --bad: #ff7a85;
        --warn: #f6c463
      }
    }

    :root[data-theme="dark"] {
      --bg: #10162a;
      --card: #1a2340;
      --ink: #eef1fb;
      --mute: #9aa6c6;
      --line: #34416b;
      --acc: #7b9bff;
      --accink: #10162a;
      --ok: #4fd1a1;
      --bad: #ff7a85;
      --warn: #f6c463
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 "Trebuchet MS", "Segoe UI", Verdana, sans-serif
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 16px 14px 60px
    }

    h1 {
      font-size: clamp(26px, 5vw, 38px);
      margin: 4px 0;
      line-height: 1.15
    }

    h2 {
      font-size: 23px;
      margin: 0 0 8px
    }

    h3 {
      font-size: 18px;
      margin: 16px 0 8px
    }

    p {
      margin: 6px 0
    }

    .mute {
      color: var(--mute)
    }

    .hide {
      display: none !important
    }

    .big {
      font-size: 20px;
      font-weight: 700
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px
    }

    .brand {
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      background: none;
      border: 0;
      color: var(--ink);
      font-family: inherit;
      padding: 4px 0
    }

    .score {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 5px 14px;
      font-weight: 700;
      white-space: nowrap
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 10px 0
    }

    .nav button {
      font: inherit;
      font-weight: 700;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
      border-bottom-width: 5px;
      border-radius: 10px;
      padding: 7px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1
    }

    .nav button small {
      font-size: 11px;
      font-weight: 400;
      color: var(--mute)
    }

    .nav button.on {
      background: var(--acc);
      color: var(--accink);
      border-color: var(--acc)
    }

    .nav button.on small {
      color: var(--accink)
    }

    .nav button.done:not(.on) {
      border-color: var(--ok)
    }

    .nav button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .nav b {
      font-size: 20px
    }

    .trail {
      height: 8px;
      background: var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin: 0 0 14px
    }

    .trail i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ok);
      transition: width .5s
    }

    .card {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 10px 0
    }

    .item {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px
    }

    .ico {
      font-size: 30px;
      line-height: 1.2
    }

    kbd,
    .cap {
      display: inline-block;
      font: 700 15px/1 "Courier New", monospace;
      background: #fff;
      color: #1b2540;
      border: 2px solid #aeb8cf;
      border-bottom-width: 4px;
      border-radius: 7px;
      padding: 6px 9px;
      margin: 1px 2px
    }

    .btn {
      font: inherit;
      font-weight: 700;
      background: var(--acc);
      color: var(--accink);
      border: 0;
      border-bottom: 5px solid rgba(0, 0, 0, .25);
      border-radius: 12px;
      padding: 11px 22px;
      cursor: pointer;
      margin: 6px 6px 0 0
    }

    .btn:active {
      transform: translateY(3px);
      border-bottom-width: 2px
    }

    .btn.alt {
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
      border-bottom-width: 5px
    }

    .btn.lg {
      font-size: 22px;
      padding: 15px 38px
    }

    .navrow {
      margin-top: 16px
    }

    .hero {
      display: flex;
      gap: 14px;
      align-items: center;
      color: #fff;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 16px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .4)
    }

    .hero .he {
      font-size: 44px;
      line-height: 1;
      background: rgba(255, 255, 255, .22);
      border-radius: 14px;
      padding: 10px
    }

    .qhead {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 6px
    }

    .opts {
      display: grid;
      gap: 10px;
      margin-top: 12px
    }

    .opt {
      font: inherit;
      text-align: left;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
      border-bottom-width: 5px;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer
    }

    .opt:hover {
      border-color: var(--acc)
    }

    .opt.ok {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok)
    }

    .opt.no {
      background: var(--bad);
      color: #fff;
      border-color: var(--bad)
    }

    .bar {
      height: 10px;
      background: var(--line);
      border-radius: 9px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--warn);
      width: 100%
    }

    .fig {
      margin: 10px 0;
      text-align: center
    }

    .fig img {
      width: 100%;
      max-width: 640px;
      height: auto;
      background: #fff;
      border-radius: 14px;
      border: 2px solid var(--line);
      padding: 8px
    }

    .fig figcaption {
      font-size: 14px;
      color: var(--mute);
      margin-top: 6px
    }

    .kb {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
      overflow-x: auto;
      padding: 6px 0
    }

    .row {
      display: flex;
      gap: 5px
    }

    .k {
      width: 38px;
      height: 38px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font: 700 15px "Courier New", monospace;
      background: #fff;
      color: #1b2540;
      border: 2px solid #aeb8cf;
      border-bottom-width: 7px;
      position: relative
    }

    .k:after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--fc, transparent);
      border: 1px solid rgba(0, 0, 0, .25)
    }

    .k.sp {
      width: 240px
    }

    .k.next {
      outline: 4px solid var(--acc);
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 0 0 5px rgba(47, 91, 234, .3)
    }

    .k.bump {
      outline: 4px solid var(--bad)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 14px
    }

    .legend span {
      padding: 3px 10px;
      border-radius: 20px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .45)
    }

    .zmap {
      display: grid;
      grid-template-columns: 6fr 2fr 2fr;
      grid-template-areas: "f f f" "n a p" "h a p";
      gap: 6px;
      margin: 12px 0;
      font-weight: 700;
      color: #fff;
      text-align: center
    }

    .zmap div {
      border-radius: 10px;
      padding: 12px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4)
    }

    .io {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      flex-wrap: wrap;
      margin: 12px 0
    }

    .io>div {
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 12px;
      font-size: 15px
    }

    .io span {
      font-size: 26px
    }

    .io .pc {
      font-size: 34px;
      line-height: 1.2
    }

    .io .pc {
      border-color: var(--acc)
    }

    .io .arr {
      border: 0;
      font-size: 26px;
      padding: 0
    }

    .tl {
      border-left: 4px solid var(--acc);
      margin: 12px 0 12px 8px;
      padding-left: 16px
    }

    .tl>div {
      margin: 0 0 14px;
      position: relative
    }

    .tl>div:before {
      content: "";
      position: absolute;
      left: -25px;
      top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--acc)
    }

    .tl b {
      display: block;
      font-size: 20px
    }

    .demo {
      display: inline-block;
      font: 700 20px "Courier New", monospace;
      background: var(--bg);
      border-radius: 8px;
      padding: 6px 12px;
      margin: 4px 0
    }

    .demo s {
      text-decoration: none;
      background: #ffd0d4;
      color: #1b2540;
      border-radius: 3px
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--acc);
      vertical-align: text-bottom;
      animation: bl 1s steps(1) infinite
    }

    @keyframes bl {
      50% {
        opacity: 0
      }
    }

    .sm {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0
    }

    .k2 {
      width: 44px;
      height: 52px;
      border-radius: 8px;
      background: #fff;
      color: #1b2540;
      border: 2px solid #aeb8cf;
      border-bottom-width: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: 700 16px "Courier New", monospace;
      line-height: 1.2
    }

    .k2 small {
      color: #d64550;
      font-size: 16px
    }

    .acl {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      gap: 4px;
      justify-content: center;
      margin: 12px 0
    }

    .acl kbd {
      text-align: center;
      padding: 12px 0;
      font-size: 20px;
      margin: 0
    }

    .leds {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .leds>div {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 700
    }

    .led {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--line);
      margin-right: 8px;
      vertical-align: middle
    }

    .led.on {
      background: #2fd16a;
      box-shadow: 0 0 8px #2fd16a
    }

    .ft {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 14px
    }

    .ft kbd {
      display: block;
      text-align: center;
      margin-bottom: 6px
    }

    .flow {
      display: flex;
      align-items: stretch;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0
    }

    .flow>div {
      flex: 1 1 140px;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: center
    }

    .flow .a {
      flex: 0 0 auto;
      border: 0;
      align-self: center;
      font-size: 24px;
      padding: 0
    }

    .mirror {
      text-align: center
    }

    .mk {
      font: 700 46px/1 "Courier New", monospace;
      min-width: 130px;
      display: inline-block;
      background: #fff;
      color: #1b2540;
      border: 3px solid var(--acc);
      border-bottom-width: 9px;
      border-radius: 16px;
      padding: 18px 26px;
      margin: 10px 0
    }

    .mk.pop {
      animation: pop .18s
    }

    @keyframes pop {
      50% {
        transform: scale(1.12)
      }
    }

    .spd {
      display: grid;
      grid-template-columns: 130px 1fr 80px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 15px
    }

    .target {
      font: 700 28px/1.4 "Courier New", monospace;
      letter-spacing: 2px;
      word-break: break-all;
      margin: 10px 0;
      min-height: 42px
    }

    .target .d {
      color: var(--ok)
    }

    .target .c {
      background: var(--warn);
      color: #1b2540;
      border-radius: 4px
    }

    input.hid {
      width: 100%;
      font: inherit;
      font-size: 18px;
      padding: 12px;
      border: 2px dashed var(--acc);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink)
    }

    .hunt {
      text-align: center
    }

    .hunt .letter {
      font: 700 110px/1.1 "Courier New", monospace;
      color: var(--acc);
      margin: 6px 0
    }

    .res {
      text-align: center
    }

    .res .medal {
      font-size: 64px
    }

    .hhero {
      text-align: center;
      padding: 28px 10px 8px
    }

    .hhero h1 {
      font-size: clamp(32px, 7vw, 54px)
    }

    .caps {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 18px 0
    }

    .caps kbd {
      font-size: 22px;
      padding: 11px 14px;
      margin: 0
    }

    .caps kbd {
      animation: hop 2.2s ease-in-out infinite
    }

    .caps kbd:nth-child(2n) {
      animation-delay: .25s
    }

    .caps kbd:nth-child(3n) {
      animation-delay: .5s
    }

    @keyframes hop {
      50% {
        transform: translateY(-9px)
      }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin: 16px 0
    }

    .stats div {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      text-align: center
    }

    .stats b {
      display: block;
      font-size: 30px;
      color: var(--acc)
    }

    .road {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px
    }

    .road>div {
      display: flex;
      gap: 12px;
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: var(--card)
    }

    .road .n {
      font-size: 32px;
      flex: none
    }

    @media (max-width:560px) {
      .nav b {
        font-size: 17px
      }

      .nav small {
        display: none
      }

      .k {
        width: 28px;
        height: 32px;
        font-size: 12px
      }

      .k.sp {
        width: 150px
      }

      .hunt .letter {
        font-size: 80px
      }

      .spd {
        grid-template-columns: 100px 1fr 60px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    :focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    .mp {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 14px
    }

    .mrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--line);
      padding: 6px 0
    }

    .login {
      max-width: 420px;
      margin: 12px auto
    }

    .login input {
      margin-bottom: 8px;
      text-align: center
    }

    .intro {
      background: var(--bg);
      border-left: 5px solid var(--acc);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 6px 0 12px;
      font-weight: 700
    }

    textarea.hid {
      resize: vertical;
      font-family: "Courier New", monospace
    }

    .exam {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: auto;
      background: var(--bg);
      padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(30px + env(safe-area-inset-bottom, 0px));
      user-select: none;
      -webkit-user-select: none
    }

    .exam .in {
      max-width: 760px;
      margin: 0 auto
    }

    .exh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap
    }

    .pill {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 4px 14px;
      font-weight: 700
    }

    .dots {
      display: flex;
      gap: 6px;
      margin: 8px 0
    }

    .dots i {
      flex: 1;
      height: 8px;
      border-radius: 6px;
      background: var(--line)
    }

    .dots i.g {
      background: var(--ok)
    }

    .dots i.b {
      background: var(--bad)
    }

    .dots i.c {
      background: var(--acc)
    }

    .tbl {
      width: 100%;
      border-collapse: collapse
    }

    .tbl td,
    .tbl th {
      border: 2px solid var(--line);
      padding: 6px 8px;
      text-align: left
    }

    .tbl th {
      background: var(--bg)
    }

    .vs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px
    }

    .vs .good {
      border-color: var(--ok)
    }

    .vs .badc {
      border-color: var(--bad)
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top"><button class="brand" onclick="go('home')">⌨️ Klaviatura sarguzashti</button><button
        class="btn alt" id="mn" style="margin:0 8px 0 auto;padding:6px 14px" onclick="menu()">☰ Menyu</button><button
        class="btn alt" id="hm" style="margin:0 8px 0 0;padding:6px 14px" onclick="go('home')">🏠 Bosh sahifa</button>
      <div class="score">Ball: <span id="total">0</span></div>
    </div>
    <div id="bar" class="hide">
      <div class="nav" id="nav"></div>
      <div class="trail"><i id="pg"></i></div>
    </div>
    <div id="main"></div>
    <div id="menu" class="exam hide" style="z-index:60;user-select:text"></div>
    <div id="tp" class="exam hide" style="user-select:text"></div>
  </div>

      { t: "🧩 Klaviaturaning 5 qismi", h: () => `<p>Standart klaviaturada taxminan <b>104 ta tugma</b> bor. Ular vazifasiga qarab 5 qismga bo’linadi:</p><div class="zmap"><div style="grid-area:f;background:#2f5bea">1. Funksional qator (Esc, F1–F12)</div><div style="grid-area:n;background:#d64550">2. Raqam qatori</div><div style="grid-area:h;background:#1f9d6b">3. Harf qismi (A–Z, Space, Enter…)</div><div style="grid-area:a;background:#8e44ad">4. Strelkalar va boshqaruv</div><div style="grid-area:p;background:#c97700">5. Raqamli panel</div></div>${grid([card("🔵", "Funksional qator", keys("Esc F1 F12") + "<br>Maxsus amallar."), card("🔴", "Raqam qatori", keys("1 2 0 Backspace") + "<br>Raqam va belgilar."), card("🟢", "Harf qismi", keys("A Z Tab Shift Enter") + "<br>Eng katta, asosiy qism."), card("🟣", "Strelkalar va boshqaruv", keys("← ↑ → ↓ Home End") + "<br>Kursorni boshqaradi."), card("🟠", "Raqamli panel", keys("Num Lock") + "<br>Hisoblashda qulay, noutbukda ko’pincha yo’q.")])}` },

        const id = (UID ? UID.slice(-8) : device.slice(-12)) + "~" + encodeURIComponent(n.toLowerCase()); CUR = DBD.s[id] || (DBD.s[id] = { id, uid: UID, name: n, t0: Date.now(), last: Date.now(), done: [], pts: [0, 0, 0, 0, 0, 0], att: [0, 0, 0, 0, 0, 0], best: [0, 0, 0, 0, 0, 0], log: [], view: "home", cur: 0, page: 0 });
        DBD.cur = id; loadState(); state.page = 0; state.view = "home"; go("home")
      },
      logout() { save(); CUR = null; DBD.cur = null; Object.assign(state, { done: [], pts: [0, 0, 0, 0, 0, 0], cur: 0, seen: {} }); LS.set(DBD); go("home") }
    };
    const rec = { att(c) { CUR.att[c]++; save() }, res(c, ok, pass) { CUR.best[c] = Math.max(CUR.best[c], ok); CUR.log.push({ s: c, ok, pass, t: Date.now() }); if (CUR.log.length > 60) CUR.log.shift(); save() }, n: c => CUR ? CUR.att[c] : 0, b: c => CUR ? CUR.best[c] : 0 };
    const startBtn = () => CUR ? `<p class="big">👋 Salom, <b>${esc(CUR.name)}</b>! <button class="btn alt" style="padding:4px 12px;margin:0" onclick="DB.logout()">Boshqa o’quvchi</button></p><button class="btn lg" onclick="go('lesson',${resumeStage()},0)">▶ ${state.done.length ? "Davom etish" : "Boshlash"}</button>` : `<div class="login"><input class="hid" id="nm" maxlength="30" placeholder="Ism va familiyangizni yozing" onkeydown="if(event.key=='Enter')DB.login()"><button class="btn lg" onclick="DB.login()">▶ Boshlash</button></div>`;
    const _go = go; go = (v, c, p) => { if (!CUR && v != "home") v = "home", c = undefined; $("#menu").classList.add("hide"); _go(v, c, p); save() };
    const _fin = finish; finish = (i, p) => { _fin(i, p); save() };
    /* ---------- Menyu ---------- */
    function menu() {
      const m = $("#menu"); if (!m.classList.contains("hide")) return m.classList.add("hide");
      m.innerHTML = `<div class="mp"><div class="exh"><span><b>☰ Menyu${CUR ? " · " + esc(CUR.name) : ""}</b><br><small class="mute">${CLD || location.protocol === "https:" ? "☁️ Online saqlanmoqda" : "💾 Faqat shu qurilmada saqlanadi"}</small></span><button class="btn alt" style="margin:0" onclick="menu()">✖</button></div><button class="btn alt" onclick="go('home')">🏠 Bosh sahifa</button>${names.map((n, i) => `<div class="mrow"><span>${state.done.includes(i) ? "✅" : open(i) && CUR ? n[0] : "🔒"} <b>${i + 1}. ${n[1]}</b><br><small class="mute">Ball: ${state.pts[i]} · urinish: ${CUR ? CUR.att[i] : 0}</small></span><span><button class="btn alt" ${open(i) && CUR ? "" : "disabled"} onclick="go('lesson',${i},0)">📖 Dars</button>${i == 4 ? "" : `<button class="btn alt" ${open(i) && CUR ? "" : "disabled"} onclick="go('quiz',${i})">⚡ Sinov</button>`}</span></div>`).join("")}<button class="btn alt" onclick="menu();teacher()">👩‍🏫 O’qituvchi bo’limi</button>${CUR ? `<button class="btn alt" onclick="DB.logout()">👤 Boshqa o’quvchi</button>` : ""}</div>`; m.classList.remove("hide")
    }
    /* ---------- O’qituvchi paneli ---------- */
    function tpin() { const v = $("#pin"); if (v.value == DBD.pin) teacher(true); else { v.value = ""; v.placeholder = "PIN noto’g’ri" } }
    async function delS(id, b) {
      if (!b.dataset.s) { b.dataset.s = 1; b.textContent = "Aniqmi?"; setTimeout(() => { b.dataset.s = ""; b.textContent = "🗑" }, 3000); return }
      const r = ALL[id]; delete DBD.s[id]; if (DBD.cur == id) { CUR = null; DBD.cur = null; Object.assign(state, { done: [], pts: [0, 0, 0, 0, 0, 0] }) } LS.set(DBD);
      if (CLD && r && r.uid) { try { const ref = CLD.doc("students/" + r.uid), d = await ref.get(); if (d.exists) { const m = { ...(d.data().s || {}) }; delete m[id]; await ref.set({ s: m, last: Date.now() }) } } catch (e) { } }
      else if (teacherAuth) { try { await api({ action: "delete", id }, true) } catch (e) { } }
      teacher()
    }
    let CLD = null, UID = null, ISOWN = false, syncT = null, ALL = {}, teacherAuth = null;
    const basic = value => "Basic " + btoa(Array.from(new TextEncoder().encode(value), c => String.fromCharCode(c)).join(""));
    const api = (body, auth = false) => fetch("/.netlify/functions/students", { method: "POST", headers: { "Content-Type": "application/json", ...(auth && teacherAuth ? { Authorization: basic(teacherAuth.login + ":" + teacherAuth.password) } : {}) }, body: JSON.stringify(body) });
    async function loadAll() {
      ALL = { ...DBD.s };
      if (CLD) { try { (await CLD.collection("students").get()).docs.forEach(d => { const m = (d.data() || {}).s || {}; for (const k in m) if (!ALL[k] || (m[k].last || 0) > (ALL[k].last || 0)) ALL[k] = m[k] }) } catch (e) { } return }
      try { const r = await api({ action: "list" }, true); if (r.ok) { const data = await r.json(); for (const s of data.students || []) if (!ALL[s.id] || (s.last || 0) > (ALL[s.id].last || 0)) ALL[s.id] = s } } catch (e) { }
    }
    function cloudPush() {
      if (CLD && UID) { clearTimeout(syncT); syncT = setTimeout(() => CLD.doc("students/" + UID).set({ s: DBD.s, last: Date.now() }).catch(() => { }), 1500); return }
      if (!CUR) return;
      clearTimeout(syncT); syncT = setTimeout(() => api({ action: "save", student: CUR }).catch(() => { }), 500);
    }
    function mergeCloud(m) {
      let ch = false; for (const k in m) if (!DBD.s[k] || (m[k].last || 0) > (DBD.s[k].last || 0)) { DBD.s[k] = m[k]; ch = true }
      if (DBD.cur) CUR = DBD.s[DBD.cur] || null; if (ch && CUR && state.view == "home") loadState(); LS.set(DBD)
    }
    async function cloudInit() {
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); if (user) { ISOWN = await user.isOwner(); UID = await user.id() }
        if (db && UID) { CLD = db; try { const d = await db.doc("students/" + UID).get(); if (d.exists) mergeCloud(d.data().s || {}) } catch (e) { } if (CUR) cloudPush() }
      } catch (e) { }
      if (state.view == "home") draw()
    }
    let TOK = false;
    async function tlogin() {
      const L = $("#te").value.trim(), P = $("#tpw").value;
      try {
        const r = await fetch("/.netlify/functions/students", { method: "POST", headers: { "Content-Type": "application/json", Authorization: basic(L + ":" + P) }, body: JSON.stringify({ action: "login" }) });
        if (!r.ok) throw new Error(r.status === 503 ? "Serverda o’qituvchi hisobi sozlanmagan" : "Login yoki parol noto’g’ri");
        teacherAuth = { login: L, password: P }; TOK = true; return teacher();
      } catch (e) { $("#tpw").value = ""; $("#tpw").placeholder = e.message || "Serverga ulanib bo’lmadi"; }
    }    async function teacher() {
      const m = $("#tp"); m.classList.remove("hide"); const X = `<button class="btn alt" style="margin:0" onclick="$('#tp').classList.add('hide')">✖ Yopish</button>`;
      if (!TOK) { m.innerHTML = `<div class="in"><div class="exh"><b>👩‍🏫 O’qituvchi kirishi</b>${X}</div><div class="card res"><div class="login"><input class="hid" id="te" type="text" placeholder="Login" autocomplete="username"><input class="hid" id="tpw" type="password" placeholder="Parol" autocomplete="current-password" onkeydown="if(event.key==\'Enter\')tlogin()"><button class="btn" onclick="tlogin()">Kirish</button></div></div></div>`; return }
      m.innerHTML = `<div class="in"><div class="card res"><p>⏳ Natijalar yuklanmoqda…</p></div></div>`;
      await loadAll(); const S = Object.values(ALL).sort((a, b) => sum(b.pts) - sum(a.pts)), n = S.length || 1, ago = t => { const k = Math.round((Date.now() - t) / 6e4); return k < 1 ? "hozir" : k < 60 ? k + " daq oldin" : k < 1440 ? Math.round(k / 60) + " soat oldin" : new Date(t).toLocaleDateString() };
      const csv = ["Ism;Tugatgan bosqich;Ball;Urinish;" + names.map((x, i) => (i + 1) + "-b eng yaxshi").join(";"), ...S.map(s => [s.name, s.done.length, sum(s.pts), sum(s.att), ...s.best].join(";"))].join("\n");
      m.innerHTML = `<div class="in"><div class="exh"><b>👩‍🏫 O’qituvchi paneli</b><span><button class="btn alt" style="margin:0" onclick="teacher(true)">🔄 Yangilash</button> ${X}</span></div>
 ${grid([card("👥", S.length, "o’quvchi"), card("🔁", sum(S.map(s => sum(s.att))), "jami urinish"), card("⭐", Math.round(sum(S.map(s => sum(s.pts))) / n), "o’rtacha ball"), card("🏁", S.filter(s => s.done.length == 6).length, "hammasini tugatgan")])}
 <div class="card"><h2>Bosqichlarni tugatganlar</h2>${names.map((x, i) => { const d = S.filter(s => s.done.includes(i)).length; return `<div class="spd" style="grid-template-columns:30px 1fr 60px"><span>${x[0]}</span><div class="bar"><i style="width:${d / n * 100}%;background:var(--ok)"></i></div><b>${d}/${S.length}</b></div>` }).join("")}</div>
 <div class="card"><h2>O’quvchilar natijalari</h2>${S.length ? `<div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>Ism</th><th>Bosqich</th><th>Ball</th><th>Urinish</th><th>Faollik</th><th></th></tr>${S.map((s, k) => `<tr><td>${k + 1}</td><td><b>${esc(s.name)}</b></td><td>${s.done.length}/6</td><td>${sum(s.pts)}</td><td>${sum(s.att)}</td><td>${ago(s.last)}</td><td style="white-space:nowrap"><button class="btn alt" style="margin:0;padding:4px 10px" onclick="this.closest('tr').nextElementSibling.classList.toggle('hide')">👁</button> <button class="btn alt" style="margin:0;padding:4px 10px" onclick="delS('${s.id}',this)">🗑</button></td></tr><tr class="hide"><td colspan="7">${names.map((x, i) => `<div>${x[0]} <b>${x[1]}</b>: ${s.done.includes(i) ? "✅" : "⬜"} ball ${s.pts[i]} · urinish ${s.att[i]} · eng yaxshi ${s.best[i]}/10</div>`).join("")}<hr>${s.log.slice(-8).reverse().map(l => `<div class="mute">${new Date(l.t).toLocaleString()} · ${names[l.s][1]}: ${l.ok}/10 ${l.pass ? "✅" : "❌"}</div>`).join("") || "<div class=\"mute\">Hali sinov topshirmagan</div>"}</td></tr>`).join("")}</table></div>` : `<p class="mute">Hali birorta o’quvchi yo’q.</p>`}</div>
 <div class="card"><h2>Jadval (CSV)</h2><p class="mute">Matnni belgilab nusxa oling va Excel yoki Google Sheets’ga qo’ying.</p><textarea class="hid" rows="5" readonly onclick="this.select()">${esc(csv)}</textarea></div>
  <p class="mute">${CLD || location.protocol === "https:" ? "☁️ Online: o’quvchilar natijalari umumiy bazada saqlanadi." : "💾 Online ulanish yo’q: faqat shu qurilmadagi natijalar ko’rinadi."}</p></div>`
    }
    if (DBD.cur && DBD.s[DBD.cur]) { CUR = DBD.s[DBD.cur]; loadState(); const v = CUR.view; go(v == "lesson" || v == "end" ? v : "home", CUR.cur, CUR.page) } else go("home");
    if (typeof claude != "undefined") cloudInit();
  </script>
</body>

</html>
